<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" type="text/css" href="css/main.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="tela-login">

      <div><h1>Faça seu Login</h1></div>

      <br>

        <div>
            <form>

              <div>
                <!-- email -->
                <input type="email" placeholder="email ex:@gmail.com" id="email">
              </div>

              <br>

              <div>
                <!-- senha -->
                <input type="password" placeholder="senha ex:12345" id="senha">
              </div>

                  <br>

                  <!-- botão -->
                  <button type="button"><b>Enviar</b></button>

            </form>
             
        </div>

    </div>
    
</body>
</html>
