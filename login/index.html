

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <link rel="stylesheet" type="text/css" href="css/main.css"/>
</head>
<body>

  <div><h1>Faça seu cadastro!</h1></div>

    <div>

        <form>

            <div>
              <div>
                <!-- nome-->
                <label for="n1">Nome:</label>
                <input type="text" placeholder="Seu nome" id="n1">
              </div>

               <br>

              <div>
                <!-- email -->
                <label for="e1">Email:</label>
                <input type="email" placeholder="Seu e-mail" id="e1">
              </div>

              <br>

              <div>
                <!-- senha -->
                <label for="s1">Senha:</label>
                <input type="password" placeholder="Sua senha" id="s1">
              </div>

              <br>


              <!-- botão -->
              <button type="button">Enviar</button>
            </div>

        </form>

    </div>

    
</body>
</html>
